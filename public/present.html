<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter console · A Day in Shanghai</title>
<style>
:root{--bg:#0b0d0e;--panel:#14181a;--line:#263034;--ink:#eef3f1;--muted:#8fa19b;--gold:#ffd24a;--red:#ff5a4e;--green:#3ee08f;--cred:#c8102e;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#3a0610,#14181a 40%)}
header b{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.pill{font-family:var(--mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--muted)}
.pill em{font-style:normal;color:var(--ink)}
header .sp{flex:1}
a{color:var(--gold)}
main{flex:1;display:grid;grid-template-columns:1fr 380px;gap:20px;padding:20px 22px;min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.k{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1{margin:0 0 6px;font-size:34px;line-height:1.15}
h2{margin:0;font-size:20px}
.now .type{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--cred);color:#fff;margin-bottom:10px}
.now .type.play{background:#1f6d45}
ol{padding-left:22px;margin:10px 0}
ol li{margin:6px 0;font-size:19px}
.box{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:18px}
.box.ask{background:#101b16;border:1px solid #1f3a2c}
.box.ir{background:#221806;border:1px solid #8a6a10}
.box.notes{background:#11161d;border:1px solid #23344a}
.box span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:16px}
.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
button{font:700 18px var(--mono);border-radius:12px;border:1px solid var(--line);background:#1d2427;color:var(--ink);padding:18px;cursor:pointer}
button.next{background:var(--cred);border-color:#ff7a7a;color:#fff}
button:active{transform:scale(.98)}
.big{font:800 44px var(--mono);color:var(--gold);line-height:1}
.prog{height:8px;background:#1d2427;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.outline{max-height:42vh;overflow:auto;font-family:var(--mono);font-size:13px}
.outline div{padding:4px 8px;border-radius:6px;color:var(--muted);cursor:pointer}
.outline div.cur{background:var(--cred);color:#fff}
.outline div:hover{background:#1d2427}
.warn{color:var(--red);font-family:var(--mono)}
.tldr{font-size:30px;line-height:1.25;font-weight:800;color:var(--gold);margin:6px 0 16px;padding:14px 18px;border-left:6px solid var(--gold);background:#1d1806;border-radius:8px}
.tldr small{display:block;font:600 11px var(--mono);letter-spacing:.16em;color:var(--muted);margin-bottom:4px}
.say{list-style:none;padding:0;margin:0}
.say li{position:relative;padding:8px 0 8px 30px;font-size:21px;border-bottom:1px solid #1f272a}
.say li::before{content:"▸";position:absolute;left:6px;color:var(--red)}
.say li b{color:#fff}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.cmp div{background:#11161d;border:1px solid #23344a;border-radius:10px;padding:8px 12px;font-size:16px}
.cmp b{display:block;font:700 11px var(--mono);letter-spacing:.14em}
.printbtn{font:600 13px var(--mono);padding:6px 12px;border-radius:8px}
@media print{header,aside,.side,.printbtn{display:none!important}body{background:#fff;color:#000}main{display:block;padding:0}#now{display:none}#printall{display:block!important}
  .pstep{break-inside:avoid;border-bottom:1px solid #ccc;padding:8px 0}.pstep h3{margin:0;font:700 14px system-ui}.pstep .t{font-weight:700;color:#a00;margin:2px 0}.pstep ul{margin:2px 0 0 18px;padding:0;font-size:12px}}
#printall{display:none}
.box.quiet{background:#14122a;border:1px solid #4b3fa8}.box.quiet ol{margin:4px 0 0;padding-left:22px}.box.quiet li{font-size:19px;margin:4px 0}
</style>
</head>
<body>
<header><b>Presenter console</b><span class="pill">Step <em id="pos">–</em></span><span class="pill">⏱ <em id="timer">0:00</em> on this step</span><span class="pill">👥 <em id="players">0</em> players</span><span class="sp"></span><button class="printbtn" onclick="window.print()">🖨 Print all notes</button><a id="screenLink" target="_blank">Open projector screen ↗</a></header>
<main>
  <section class="card now" id="now"></section><section id="printall"></section>
  <aside class="side">
    <div class="ctrl"><button id="prev">◀ Back</button><button class="next" id="next">Next ▶</button></div>
    <div class="card" id="live"></div>
    <div class="card"><div class="k">Up next</div><div id="upnext"></div></div>
    <div class="card"><div class="k">Run of show — click to jump</div><div class="outline" id="outline"></div></div>
    <p class="warn" id="keywarn" hidden>No host key in the URL — controls are disabled. Open /present?key=YOUR_HOST_KEY</p>
  </aside>
</main>
<script src="/content.js"></script>
<script>
const { SCENES, POLLS, STEPS, NOTES, CASE, INFORM, INTRO, DAILY, PROMPTS, CAMHIST, KINDS } = window.GAME;
const KEY = new URLSearchParams(location.search).get("key");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("screenLink").href = "/screen" + (KEY ? "?key=" + encodeURIComponent(KEY) : "");
if (!KEY) $("keywarn").hidden = false;
const host = (action, extra = {}) => KEY && fetch("/api/host", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEY, action, ...extra }) });
$("next").onclick = () => host("next");
$("prev").onclick = () => host("prev");
addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); host("next"); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); host("prev"); }
});

function label(st) {
  if (!st) return "—";
  const sc = st.i !== undefined && SCENES[st.i];
  switch (st.type) {
    case "lobby": return "Lobby — everyone joins";
    case "brief": return `${sc.clock} · Explain: ${sc.brief.title}`;
    case "scene": return `${sc.clock} · Play: ${sc.title}`;
    case "reveal": return `${sc.clock} · Results: ${sc.title}`;
    case "debrief": return `${sc.clock} · Debrief: ${sc.debrief.title}`;
    case "camhist": return "How the cameras came — Sky Net & Xinjiang";
    case "daily": return "Intro — every day in China (data scale)";
    case "intro": return "Intro — what is privacy? (1–2 min)";
    case "inform": return "Side quest — the counsellor calls every phone";
    case "informres": return "Side quest results — who reported a classmate";
    case "case": return "The case for it — safety & convenience";
    case "file": return "Finale — one person, one file";
    case "unique": return "Anonymity test";
    case "meta": return "Plot twist — the game tracked you";
    case "poll": return "Poll: " + POLLS[st.i].q;
    case "pollres": return "Poll results: " + POLLS[st.i].q;
    case "end": return "End — back to the slides";
  }
  return st.type;
}

$("outline").innerHTML = STEPS.map((st, k) => `<div data-k="${k}">${k + 1}. ${esc(label(st))}</div>`).join("");
$("outline").onclick = (e) => { const k = e.target.dataset.k; if (k !== undefined) host("goto", { step: Number(k) }); };

let curKey = null, since = Date.now();
setInterval(() => { const s = ((Date.now() - since) / 1000) | 0; $("timer").textContent = (s / 60 | 0) + ":" + String(s % 60).padStart(2, "0"); }, 500);

const sentences = (t) => String(t || "").split(/(?<=[.!?])\s+(?=[A-Z“"(])/).filter(Boolean);
// One summary per step: tldr (one line), say (short bullets), plus optional ask / angle / compare
function summary(st) {
  const sc = st.i !== undefined && ["brief", "scene", "reveal", "debrief"].includes(st.type) ? SCENES[st.i] : null;
  if (st.type === "brief") return { tldr: sc.brief.tldr, say: sc.brief.points, ask: sc.brief.ask, extra: sentences(sc.brief.notes) };
  if (st.type === "debrief") return { tldr: sc.debrief.tldr, say: sc.debrief.points, angle: sc.debrief.ir, pro: sc.debrief.pro, extra: sentences(sc.debrief.notes) };
  if (st.type === "camhist") return { tldr: CAMHIST.tldr, say: CAMHIST.say, angle: CAMHIST.callout, extra: CAMHIST.timeline.map(([y, t, zh, txt]) => `${y} · ${t} (${zh}): ${txt}`) };
  if (st.type === "daily") return { tldr: DAILY.tldr, say: DAILY.say, extra: DAILY.items.map((it) => `${it.n} ${it.label} — ${it.src}`) };
  if (st.type === "intro") return { tldr: INTRO.tldr, say: INTRO.say, extra: [`Definition: “${INTRO.def}” (${INTRO.defBy})`, ...INTRO.timeline.map(([y, t]) => `${y}: ${t}`)] };
  if (st.type === "inform") return { tldr: "Every phone gets a private call: name a classmate, or refuse.", say: ["Don't explain — just say: answer your phone", "Teacher Jan asks who complained online, for +50 points", "Watch the answered counter; Next when most have answered"] };
  if (st.type === "informres") return { tldr: "How many of you reported a classmate — for 50 points?", say: INFORM.facts.map(([n, l, src]) => `${n}: ${l} (${src})`), ask: INFORM.ask, angle: INFORM.angle, extra: ["Reporting also shows up in each player's file at the end (informant / uncooperative)."] };
  if (st.type === "case") return { tldr: CASE.tldr, say: [`Safe at night: ${CASE.safe.rows.map(([n, v]) => n + " " + v + "%").join(", ")} (${CASE.safe.src})`, ...CASE.tiles.map(([n, l, src]) => `${n} ${l} (${src})`)], ask: CASE.ask, cav: CASE.caveats, extra: sentences(CASE.notes) };
  if (st.type === "scene") {
    const bad = sc.options.filter((o) => o.outcome !== "ok");
    return { tldr: `${sc.title}: let them choose — don't explain yet.`,
      say: [`<b>Read:</b> ${esc(sc.story)}`, `<b>Options:</b> ${sc.options.map((o) => (o.kind ? esc(KINDS[o.kind]) + " " : "") + esc(o.label)).join(" · ")}`,
        ...bad.map((o) => `<b>Catch:</b> “${esc(o.label)}” → ${esc(o.result)}`), "Watch the counter; press Next when most have decided"], raw: true };
  }
  if (st.type === "reveal") return { tldr: sentences(sc.explain)[0], say: sentences(sc.explain).slice(1).concat(["Ask one person why they chose what they did"]), cmp: sc.compare };
  if (st.type === "poll" || st.type === "pollres") {
    const q = POLLS[st.i];
    return { tldr: q.q, say: st.type === "poll" ? [`Options: ${q.options.join(" · ")}`, "Give 20–30 seconds"] : ["Read the room's result", `China: ${q.china}`] };
  }
  const n = NOTES[st.type] || { tldr: "", say: [] };
  return { tldr: n.tldr, say: n.say };
}
function backup(st) {
  if (["reveal", "debrief"].includes(st.type)) return (PROMPTS[SCENES[st.i].id] || {})[st.type] || [];
  return PROMPTS[st.type] || [];
}
function summaryHtml(m) {
  const li = (x) => `<li>${m.raw ? x : esc(x)}</li>`;
  return `<div class="tldr"><small>In one line</small>${esc(m.tldr)}</div>
    <div class="sec">Say</div><ul class="say">${m.say.map(li).join("")}</ul>
    ${m.ask ? `<div class="box ask"><span>Ask the room</span>${esc(m.ask)}</div>` : ""}
    ${m.angle ? `<div class="box ir"><span>Political-science angle</span>${esc(m.angle)}</div>` : ""}
    ${m.pro ? `<div class="box" style="background:#0f1f17;border:1px solid #2c6b4a"><span>⚖ The case for it</span>${esc(m.pro)}</div>` : ""}
    ${m.cav ? `<div class="box" style="background:#1f0f10;border:1px solid #6b2c2c"><span>But…</span>${m.cav.map(esc).join("<br>")}</div>` : ""}
    ${m.cmp ? `<div class="sec">Compare</div><div class="cmp"><div><b style="color:#ff8a7e">CHINA</b>${esc(m.cmp.cn)}</div><div><b style="color:#7cc4ff">EU / POLAND</b>${esc(m.cmp.eu)}</div><div><b style="color:#ffbf47">USA</b>${esc(m.cmp.us)}</div></div>` : ""}
    ${m.backup && m.backup.length ? `<div class="box quiet"><span>🙋 If the room is quiet, ask</span><ol>${m.backup.map((q) => `<li>${esc(q)}</li>`).join("")}</ol></div>` : ""}
    ${m.extra && m.extra.length ? `<div class="sec">If you have time</div><ul class="say">${m.extra.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`;
}
$("printall").innerHTML = "<h2>A Day in Shanghai — presenter notes</h2>" + STEPS.map((st, k) => { const m = summary(st); return `<div class="pstep"><h3>${k + 1}. ${esc(label(st))}</h3><div class="t">${esc(m.tldr)}</div><ul>${m.say.map((x) => `<li>${m.raw ? x : esc(x)}</li>`).join("")}${m.ask ? `<li><b>Ask:</b> ${esc(m.ask)}</li>` : ""}${m.angle ? `<li><b>Angle:</b> ${esc(m.angle)}</li>` : ""}${m.pro ? `<li><b>Case for:</b> ${esc(m.pro)}</li>` : ""}${m.cav ? `<li><b>But:</b> ${esc(m.cav.join(" "))}</li>` : ""}${backup(st).map((q) => `<li><b>If quiet:</b> ${esc(q)}</li>`).join("")}</ul></div>`; }).join("");

function render(d) {
  const st = d.step, sc = st.i !== undefined && ["brief", "scene", "reveal", "debrief"].includes(st.type) ? SCENES[st.i] : null;
  const key = st.type + ":" + (st.i ?? "");
  if (key !== curKey) { curKey = key; since = Date.now(); }
  $("pos").textContent = `${d.stepIndex + 1} / ${d.stepCount}`;
  $("players").textContent = d.players;
  const isPlay = ["scene", "poll", "inform"].includes(st.type);
  const sm = summary(st); sm.backup = backup(st);
  let body = `<span class="type ${isPlay ? "play" : ""}">${isPlay ? "Phones active" : ["brief", "debrief", "intro", "daily", "camhist"].includes(st.type) ? "You talk" : "Show & discuss"}</span><h1>${esc(label(st))}</h1>` + summaryHtml(sm);
  $("now").innerHTML = body;

  let live = `<div class="k">Live</div>`;
  if (st.type === "scene" && d.stats) {
    live += `<div class="big">${d.stats.answered} / ${d.players}</div><div>decided${d.stats.blocked ? ` · <span style="color:var(--red)">${d.stats.blocked} blocked</span>` : ""}</div><div class="prog"><i style="width:${d.players ? Math.round(d.stats.answered / d.players * 100) : 0}%"></i></div>`;
    if (d.offenders && d.offenders.length) live += `<p style="margin:10px 0 0">☎ Secretary Lin will call: <b>${esc(d.offenders.map((o) => o.name).join(", "))}</b></p>`;
  } else if (st.type === "inform" && d.inform) {
    live += `<div class="big">${d.inform.answered} / ${d.players}</div><div>answered · <span style="color:var(--red)">${d.inform.reported} reported</span> · ${d.inform.refused} refused</div>`;
  } else if (st.type === "poll") {
    live += `<div class="big">${d.voted || 0} / ${d.players}</div><div>voted</div>`;
  } else live += `<div class="big">${d.players}</div><div>players in the room</div>`;
  $("live").innerHTML = live;

  const nx = STEPS[d.stepIndex + 1];
  $("upnext").innerHTML = nx ? `<h2>${esc(label(nx))}</h2>` : "<h2>— end —</h2>";
  document.querySelectorAll("#outline div").forEach((el) => el.classList.toggle("cur", Number(el.dataset.k) === d.stepIndex));
  const cur = document.querySelector("#outline .cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
}

const es = new EventSource("/events?screen=1");
es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (err) { console.error(err); } };
</script>
</body>
</html>
