<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter console · A Day in Shanghai</title>
<style>
:root{--bg:#0b0d0e;--panel:#14181a;--line:#263034;--ink:#eef3f1;--muted:#8fa19b;--gold:#ffd24a;--red:#ff5a4e;--green:#3ee08f;--cred:#c8102e;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#3a0610,#14181a 40%)}
header b{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.pill{font-family:var(--mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;color:var(--muted)}
.pill em{font-style:normal;color:var(--ink)}
header .sp{flex:1}
a{color:var(--gold)}
main{flex:1;display:grid;grid-template-columns:1fr 380px;gap:20px;padding:20px 22px;min-height:0}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.k{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
h1{margin:0 0 6px;font-size:34px;line-height:1.15}
h2{margin:0;font-size:20px}
.now .type{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:6px;background:var(--cred);color:#fff;margin-bottom:10px}
.now .type.play{background:#1f6d45}
ol{padding-left:22px;margin:10px 0}
ol li{margin:6px 0;font-size:19px}
.box{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:18px}
.box.ask{background:#101b16;border:1px solid #1f3a2c}
.box.ir{background:#221806;border:1px solid #8a6a10}
.box.notes{background:#11161d;border:1px solid #23344a}
.box span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.side{display:flex;flex-direction:column;gap:16px}
.ctrl{display:grid;grid-template-columns:1fr 2fr;gap:10px}
button{font:700 18px var(--mono);border-radius:12px;border:1px solid var(--line);background:#1d2427;color:var(--ink);padding:18px;cursor:pointer}
button.next{background:var(--cred);border-color:#ff7a7a;color:#fff}
button:active{transform:scale(.98)}
.big{font:800 44px var(--mono);color:var(--gold);line-height:1}
.prog{height:8px;background:#1d2427;border-radius:99px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.outline{max-height:42vh;overflow:auto;font-family:var(--mono);font-size:13px}
.outline div{padding:4px 8px;border-radius:6px;color:var(--muted);cursor:pointer}
.outline div.cur{background:var(--cred);color:#fff}
.outline div:hover{background:#1d2427}
.warn{color:var(--red);font-family:var(--mono)}
</style>
</head>
<body>
<header><b>Presenter console</b><span class="pill">Step <em id="pos">–</em></span><span class="pill">⏱ <em id="timer">0:00</em> on this step</span><span class="pill">👥 <em id="players">0</em> players</span><span class="sp"></span><a id="screenLink" target="_blank">Open projector screen ↗</a></header>
<main>
  <section class="card now" id="now"></section>
  <aside class="side">
    <div class="ctrl"><button id="prev">◀ Back</button><button class="next" id="next">Next ▶</button></div>
    <div class="card" id="live"></div>
    <div class="card"><div class="k">Up next</div><div id="upnext"></div></div>
    <div class="card"><div class="k">Run of show — click to jump</div><div class="outline" id="outline"></div></div>
    <p class="warn" id="keywarn" hidden>No host key in the URL — controls are disabled. Open /present?key=YOUR_HOST_KEY</p>
  </aside>
</main>
<script src="/content.js"></script>
<script>
const { SCENES, POLLS, STEPS, NOTES } = window.GAME;
const KEY = new URLSearchParams(location.search).get("key");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("screenLink").href = "/screen" + (KEY ? "?key=" + encodeURIComponent(KEY) : "");
if (!KEY) $("keywarn").hidden = false;
const host = (action, extra = {}) => KEY && fetch("/api/host", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEY, action, ...extra }) });
$("next").onclick = () => host("next");
$("prev").onclick = () => host("prev");
addEventListener("keydown", (e) => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); host("next"); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); host("prev"); }
});

function label(st) {
  if (!st) return "—";
  const sc = st.i !== undefined && SCENES[st.i];
  switch (st.type) {
    case "lobby": return "Lobby — everyone joins";
    case "brief": return `${sc.clock} · Explain: ${sc.brief.title}`;
    case "scene": return `${sc.clock} · Play: ${sc.title}`;
    case "reveal": return `${sc.clock} · Results: ${sc.title}`;
    case "debrief": return `${sc.clock} · Debrief: ${sc.debrief.title}`;
    case "file": return "Finale — one person, one file";
    case "unique": return "Anonymity test";
    case "meta": return "Plot twist — the game tracked you";
    case "poll": return "Poll: " + POLLS[st.i].q;
    case "pollres": return "Poll results: " + POLLS[st.i].q;
    case "end": return "End — back to the slides";
  }
  return st.type;
}

$("outline").innerHTML = STEPS.map((st, k) => `<div data-k="${k}">${k + 1}. ${esc(label(st))}</div>`).join("");
$("outline").onclick = (e) => { const k = e.target.dataset.k; if (k !== undefined) host("goto", { step: Number(k) }); };

let curKey = null, since = Date.now();
setInterval(() => { const s = ((Date.now() - since) / 1000) | 0; $("timer").textContent = (s / 60 | 0) + ":" + String(s % 60).padStart(2, "0"); }, 500);

function render(d) {
  const st = d.step, sc = st.i !== undefined && ["brief", "scene", "reveal", "debrief"].includes(st.type) ? SCENES[st.i] : null;
  const key = st.type + ":" + (st.i ?? "");
  if (key !== curKey) { curKey = key; since = Date.now(); }
  $("pos").textContent = `${d.stepIndex + 1} / ${d.stepCount}`;
  $("players").textContent = d.players;
  const isPlay = ["scene", "poll"].includes(st.type);
  let body = `<span class="type ${isPlay ? "play" : ""}">${isPlay ? "Phones active" : st.type === "brief" || st.type === "debrief" ? "You talk" : "Show & discuss"}</span><h1>${esc(label(st))}</h1>`;
  if (st.type === "brief" || st.type === "debrief") {
    const b = st.type === "brief" ? sc.brief : sc.debrief;
    body += `<ol>${b.points.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>
      ${st.type === "brief" ? `<div class="box ask"><span>Ask the room</span>${esc(b.ask)}</div>` : `<div class="box ir"><span>Political-science angle</span>${esc(b.ir)}</div>`}
      <div class="box notes"><span>Your notes</span>${esc(b.notes)}</div>`;
  } else if (sc) {
    body += `<p style="font-size:19px">${esc(sc.story)}</p>
      <div class="box notes"><span>Your notes</span>${esc(NOTES[st.type] || "")}</div>
      ${st.type === "reveal" ? `<div class="box ir"><span>The real fact</span>${esc(sc.explain)}</div>` : `<div class="box ask"><span>Why these choices (on screen)</span>${esc(sc.why || "")}</div>`}`;
  } else {
    body += `<div class="box notes"><span>Your notes</span>${esc(NOTES[st.type] || "")}</div>`;
  }
  $("now").innerHTML = body;

  let live = `<div class="k">Live</div>`;
  if (st.type === "scene" && d.stats) {
    live += `<div class="big">${d.stats.answered} / ${d.players}</div><div>decided${d.stats.blocked ? ` · <span style="color:var(--red)">${d.stats.blocked} blocked</span>` : ""}</div><div class="prog"><i style="width:${d.players ? Math.round(d.stats.answered / d.players * 100) : 0}%"></i></div>`;
    if (d.offenders && d.offenders.length) live += `<p style="margin:10px 0 0">☎ Secretary Lin will call: <b>${esc(d.offenders.map((o) => o.name).join(", "))}</b></p>`;
  } else if (st.type === "poll") {
    live += `<div class="big">${d.voted || 0} / ${d.players}</div><div>voted</div>`;
  } else live += `<div class="big">${d.players}</div><div>players in the room</div>`;
  $("live").innerHTML = live;

  const nx = STEPS[d.stepIndex + 1];
  $("upnext").innerHTML = nx ? `<h2>${esc(label(nx))}</h2>` : "<h2>— end —</h2>";
  document.querySelectorAll("#outline div").forEach((el) => el.classList.toggle("cur", Number(el.dataset.k) === d.stepIndex));
  const cur = document.querySelector("#outline .cur"); if (cur) cur.scrollIntoView({ block: "nearest" });
}

const es = new EventSource("/events?screen=1");
es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch (err) { console.error(err); } };
</script>
</body>
</html>
